<script>const games=[["Teen Patti 20-20","♠️","Cards"],["Poker 2020","🂡","Cards"],["Dragon Tiger","🐉","Table"],["Baccarat","♦️","Table"],["Amar Akbar Anthony","🎴","Cards"],["Lucky 7 A","7️⃣","Cards"],["Lucky 7 B","⭐","Cards"],["32 Cards Race 20","🏇","Special"],["European Roulette","🎡","Wheel"],["Aviator","✈️","Special"],["Teen Patti One Day","🂱","Cards"],["Poker One Day","🃏","Cards"],["Dragon Tiger Coin Flip","🪙","Table"],["Football Studio","⚽","Special"],["Muflis Teen Patti","🎴","Cards"],["32 Cards A","🂠","Cards"],["32 Cards B","🂡","Cards"],["Andar Bahar 1","🟠","Cards"],["Andar Bahar 2","🔵","Cards"],["Bollywood Casino","🎬","Special"],["Worli Matka","🔢","Special"],["Lightning Roulette","⚡","Wheel"],["Crazy Time","🎉","Wheel"],["Sic Bo","🎲","Wheel"]];let category='All',favs=new Set();function set(c){category=c;document.querySelectorAll('.mobilebar button').forEach(b=>b.classList.toggle('active',b.textContent.includes(c==='All'?'Home':c==='Cards'?'Cards':c==='Table'?'Tables':c==='Wheel'?'Wheel':c==='Favorites'?'Saved':'Special')));draw()}function glow(c){return c==='Cards'?'#9d37d5':c==='Wheel'?'#793de0':c==='Table'?'#146c78':'#183f91'}function draw(){let q=document.getElementById('search').value.toLowerCase();let list=games.filter(g=>(category==='All'||category==='Favorites'&&favs.has(g[0])||g[2]===category)&&g[0].toLowerCase().includes(q));document.getElementById('heading').textContent=(category==='All'?'⭐ All Games':category==='Favorites'?'♡ Favorites':category+' Games')+' ('+list.length+')';document.getElementById('grid').innerHTML=list.map(g=>'<article class="card" tabindex="0" data-name="'+g[0]+'"><div class="picture" style="--glow:'+glow(g[2])+'"><span>'+g[1]+'</span></div><button class="fav" data-f="'+g[0]+'">'+(favs.has(g[0])?'★':'☆')+'</button><div class="name">'+g[0]+'</div></article>').join('');document.querySelectorAll('.card').forEach(c=>{c.onclick=e=>{if(e.target.closest('.fav'))return;open(games.find(g=>g[0]===c.dataset.name))};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(games.find(g=>g[0]===c.dataset.name))}}});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=e=>{e.stopPropagation();favs.has(b.dataset.f)?favs.delete(b.dataset.f):favs.add(b.dataset.f);draw()})}function open(g){document.getElementById('art').textContent=g[1];document.getElementById('title').textContent=g[0];document.getElementById('msg').textContent=g[2]+' · selected';document.getElementById('launch').onclick=()=>document.getElementById('msg').textContent='Preview selected. Interactive simulation is a separate development step.';document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}draw();</script></body></html>
