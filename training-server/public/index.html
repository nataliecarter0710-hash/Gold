<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goldbet9 Training</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f2dfad;font-family:Arial,sans-serif}header{padding:18px;background:#15120b;border-bottom:1px solid #a88940}h1{margin:0;color:#dfbb60}header p{color:#bbb;margin:8px 0 0}main{max-width:1100px;margin:auto;padding:14px}.notice{border:1px solid #a88940;border-radius:10px;padding:12px;text-align:center;font-weight:bold;margin:12px 0;color:#f4d77c}.balance{background:#19150e;border-radius:12px;padding:16px;margin:12px 0}.balance strong{font-size:24px;color:#fff}.controls{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:12px;background:#c6a04b;color:#111;font-weight:bold;cursor:pointer}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.game{background:#18140c;border:1px solid #594627;border-radius:12px;padding:12px}.game h3{margin:0 0 8px}.small{font-size:12px;color:#aaa}.timer{font-size:22px;margin:8px 0;color:#fff}.outcome{margin:8px 0;color:#f5d77b;font-weight:bold}.history{list-style:none;padding:0}.history li{border-bottom:1px solid #333;padding:10px;color:#ddd}footer{text-align:center;color:#aaa;font-size:12px;padding:20px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><h1>GOLDBET9</h1><p>Educational Game Mechanics Simulator</p></header><main>
<div class="notice">SIMULATED PRACTICE POINTS ONLY — EDUCATIONAL TRAINING — 18+/21+</div>
<div class="balance">Guest practice session<br><strong id="balance">10,000</strong> display points <div class="controls" style="margin-top:12px"><button id="start">Start guest session</button><button id="refill" disabled>Refill display points</button></div></div>
<h2>Demonstration tables</h2><div id="games" class="grid">Loading…</div><h2>Observed history</h2><ul id="history" class="history"></ul></main><footer>Educational demonstration only. No wagers, deductions or settlement. 18+/21+.</footer>
<script>
let session=null;const box=document.getElementById("games"),hist=document.getElementById("history"),bal=document.getElementById("balance");
async function start(){const r=await fetch("/api/session",{method:"POST"});session=await r.json();bal.textContent=Number(session.displayPoints).toLocaleString();document.getElementById("refill").disabled=false;refreshHistory();}
document.getElementById("start").onclick=start;
document.getElementById("refill").onclick=async()=>{if(!session)return;const r=await fetch("/api/session/"+session.sessionId+"/refill",{method:"POST"});session=await r.json();bal.textContent=Number(session.displayPoints).toLocaleString();};
async function games(){const r=await fetch("/api/games"),gs=await r.json();box.innerHTML="";for(const g of gs){const c=document.createElement("div");c.className="game";c.innerHTML="<h3></h3><div class='small'></div><div class='timer'></div><div class='small phase'></div><div class='outcome'></div>";c.querySelector("h3").textContent=g.name;c.querySelector(".small").textContent=g.options.join(" · ");box.appendChild(c);const poll=async()=>{try{const u="/api/rounds/active?gameId="+encodeURIComponent(g.id)+(session?"&sessionId="+encodeURIComponent(session.sessionId):"");const x=await(await fetch(u)).json();c.querySelector(".timer").textContent=x.secondsRemaining+" sec";c.querySelector(".phase").textContent=x.phase==="OPEN"?"Demonstration in progress":x.phase==="LOCKED"?"Final countdown":"Round complete";c.querySelector(".outcome").textContent=x.outcome?"Observed outcome: "+x.outcome:"";if(x.phase==="COMPLETED")refreshHistory();}catch{c.querySelector(".phase").textContent="Connection unavailable";}};poll();setInterval(poll,1000);}}
async function refreshHistory(){if(!session)return;try{const x=await(await fetch("/api/history?sessionId="+encodeURIComponent(session.sessionId))).json();hist.innerHTML="";if(!x.history.length){hist.textContent="No observed rounds yet.";return;}x.history.slice(0,40).forEach(a=>{const li=document.createElement("li");li.textContent=a.gameName+" — "+a.observedOutcome+" — "+new Date(a.createdAt).toLocaleString();hist.appendChild(li);});}catch{}}
games();
</script></body></html>
