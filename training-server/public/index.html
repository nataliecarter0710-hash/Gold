<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Goldbet9 — 24-Game Studio & Admin Portal</title>
<style>
:root{--bg:#070b14;--card:#0f172a;--card2:#162033;--line:#1e293b;--gold:#f59e0b;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding-bottom:32px}
.disc{background:#111827;border-bottom:1px solid #1f2937;padding:7px 12px;font-size:11px;color:#cbd5e1;text-align:center}
.hdr{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.brand span{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#090d16;padding:2px 7px;border-radius:6px;font-size:12px}
.pill{font-size:11px;background:#064e3b;color:#6ee7b7;padding:2px 8px;border-radius:999px;border:1px solid #047857}
.balBox{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bal{color:#34d399;font-weight:800;font-size:15px}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;color:#fff}
button:disabled{opacity:.42;cursor:not-allowed}
.btnRef{background:#1e293b;border:1px solid #334155;font-size:12px;padding:7px 10px}
.btnAdm{background:#78350f;border:1px solid #f59e0b;color:#fde68a;font-size:12px;padding:7px 10px}
.wrap{max-width:980px;margin:0 auto;padding:12px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.secHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search,.inp{background:#0b111e;border:1px solid #334155;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
.search{width:155px}.inp{width:100%}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cbtn{background:#1e293b;color:#cbd5e1;font-size:11px;padding:5px 10px;border-radius:999px}
.cbtn.active{background:#0284c7;color:#fff}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:7px;max-height:175px;overflow-y:auto}
.gbtn{background:var(--card2);border:1px solid #293548;text-align:left;padding:8px 10px;border-radius:10px}
.gbtn .gn{font-size:12px;font-weight:700;color:#f1f5f9;display:block}.gbtn .gp{font-size:10px;color:var(--gold)}
.gbtn.active{background:linear-gradient(135deg,#0c4a6e,#1e3a8a);border-color:#38bdf8}
.felt{background:radial-gradient(circle at top,#065f46 0%,#064e3b 48%,#022c22 100%);border:2px solid #059669;border-radius:14px;padding:12px;margin:10px 0;min-height:110px}
.feltTop{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#a7f3d0;gap:6px;flex-wrap:wrap}
.pbar{height:5px;background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden;margin:8px 0}
.pfill{height:100%;background:linear-gradient(90deg,#10b981,#fbbf24);width:100%;transition:width .4s linear}
.visualRow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;min-height:54px}
.pcard{width:42px;height:58px;background:#fff;color:#0f172a;border-radius:7px;display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-weight:800;font-size:13px}
.pcard.red{color:#dc2626}.pcard.back{background:#1d4ed8;border:2px solid #93c5fd}
.die{width:44px;height:44px;background:#f8fafc;color:#0f172a;border-radius:10px;display:grid;place-items:center;font-size:20px;font-weight:900}
.winBanner{background:rgba(0,0,0,.5);border:1px solid #fbbf24;color:#fde68a;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{border-radius:999px;padding:7px 13px;font-size:12px;border:2px dashed rgba(255,255,255,.45)}
.c100{background:#0284c7}.c500{background:#059669}.c1000{background:#d97706}.c2500{background:#7c3aed}.chip.active{outline:2px solid #fff}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.optBtn{background:linear-gradient(180deg,#2563eb,#1d4ed8);border:1px solid #60a5fa;padding:12px 10px;font-size:13px}
.beads{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}.bead{font-size:11px;background:#1e293b;border:1px solid #334155;padding:3px 8px;border-radius:999px;color:#e2e8f0}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.tab{background:#1e293b;color:#cbd5e1;font-size:12px;padding:8px 12px}.tab.active{background:#2563eb;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e2937;font-size:12px;flex-wrap:wrap}
.won{color:#34d399;font-weight:800}.lost{color:#f87171;font-weight:700}.pend{color:#fbbf24;font-weight:700}
.admBox{display:none;background:#131c31;border:1px solid #f59e0b;border-radius:14px;padding:13px}
.admGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px}
.miniBtn{padding:7px 10px;font-size:11px;background:#2563eb}.warnBtn{padding:7px 10px;font-size:11px;background:#b45309}
</style>
</head>
      <button class="miniBtn" id="btnLogin">Switch Role</button>
      <button class="btnRef" id="btnDemo5m">5-Min Player Demo</button>
      <button class="btnRef" id="btnDemoRo">Mgmt Demo (Read-Only)</button>
    </div>
  </div>
  <div class="admBox" id="admPanel">
    <div class="secHead"><b style="color:#fbbf24;font-size:13px">Admin, House-Profit &amp; Downline</b><span id="admSummary" style="font-size:11px;color:#fde68a">Vol: 0 • Paid: 0 • Net: 0</span></div>
    <div class="admGrid">
      <div><label style="font-size:11px">Global House %</label><div style="display:flex;gap:6px;margin-top:4px"><input class="inp" id="gPct" type="number" min="0" max="100" value="15"/><button class="miniBtn" id="saveGPct">Set</button></div></div>
      <div><label style="font-size:11px">Game House %</label><div style="display:flex;gap:6px;margin-top:4px"><input class="inp" id="mPct" type="number" min="0" max="100" placeholder="Global"/><button class="miniBtn" id="saveMPct">Set</button><button class="btnRef" id="clrMPct">Clear</button></div></div>
      <div><label style="font-size:11px">Next Winner</label><div style="display:flex;gap:6px;margin-top:4px"><select class="inp" id="forceSel"><option value="">Auto</option></select><button class="miniBtn" id="saveForce">Apply</button></div></div>
    </div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">
      <button class="warnBtn" id="actLock">Lock Round</button>
      <button class="miniBtn" id="actSettle">Settle &amp; Next</button>
      <button class="btnRef" id="actReset">Reset Round</button>
      <button class="btnRef" id="goAdminUrl">Open /admin</button>
    </div>
    <div id="expBox" style="margin-top:8px;font-size:11px;color:#cbd5e1"></div>
    <div style="margin-top:10px;border-top:1px solid #334155;padding-top:9px">
      <b style="font-size:12px;color:#fde68a">Downline Hierarchy</b>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        <input class="inp" id="newId" placeholder="new id" style="width:120px"/>
        <select class="inp" id="newRole" style="width:auto"><option>USER</option><option>AGENT</option><option>SUB_ADMIN</option><option>ADMIN</option></select>
        <input class="inp" id="newBal" type="number" value="10000" style="width:90px"/>
        <button class="miniBtn" id="btnCreate">Create</button>
      </div>
      <div id="downList" style="margin-top:8px;font-size:12px"></div>
    </div>
  </div>
  <div class="card">
    <div class="secHead"><b style="font-size:13px">24 Training Tables</b><input class="search" id="q" placeholder="Filter 24 games..."/></div>
    <div class="cats" id="cats"><button class="cbtn active" data-c="ALL">All (24)</button><button class="cbtn" data-c="Cards">Cards</button><button class="cbtn" data-c="Wheel">Wheel</button><button class="cbtn" data-c="Dice">Dice</button><button class="cbtn" data-c="Track">Track</button><button class="cbtn" data-c="Sports">Sports</button></div>
    <div class="games" id="games"></div>
  </div>
  <div class="card">
    <div class="secHead" style="margin-bottom:2px"><div><b id="gname" style="font-size:16px">Loading...</b><div id="rid" style="font-size:11px;color:var(--muted)"></div></div><div style="text-align:right"><span id="phase" style="font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:#065f46;color:#6ee7b7">OPEN</span> <b id="timer" style="font-size:16px;margin-left:4px">--s</b></div></div>
    <div class="felt"><div class="feltTop"><span id="stageHint">Place selection before lock</span><span id="payoutTag">Payout --x • HP --%</span></div><div class="pbar"><div class="pfill" id="pfill"></div></div><div class="visualRow" id="visualRow"></div></div>
    <div class="chips"><button class="chip c100 active" data-c="100">100 VC</button><button class="chip c500" data-c="500">500 VC</button><button class="chip c1000" data-c="1000">1,000 VC</button><button class="chip c2500" data-c="2500">2,500 VC</button></div>
    <div class="opts" id="opts"></div>
    <div id="msg" style="margin-top:8px;font-size:12px;color:#93c5fd;min-height:16px"></div>
    <div class="beads" id="recent"></div>
  </div>
  <div class="card">
    <div class="tabs"><button class="tab active" id="tBets">Live Bets &amp; Settlements</button><button class="tab" id="tStmt">Account Statement</button></div>
    <div id="hist" style="font-size:12px;color:var(--muted)">No entries yet.</div>
    <div id="stmt" style="display:none;font-size:12px;color:#cbd5e1"></div>
  </div>
</div>
<script src="/app.js?v=3"></script>
</body>
</html>
